[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonseg"
version = "0.1.0"
description = "LuSNAR scene-held-out semantic segmentation with DINOv3 and Mask2Former"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "scipy>=1.12,<2",
    "PyYAML>=6,<7",
    "omegaconf>=2.3,<3",
    "safetensors>=0.5,<1",
    "einops>=0.8,<0.9",
]

[project.optional-dependencies]
baselines = [
    "timm==1.0.17",
    "ftfy==6.1.1",
    "regex==2026.11.9",
    "iopath==0.1.10",
    "huggingface_hub==0.36.0",
    "tqdm==4.70.1",
    "psutil==7.2.2",
    "pycocotools==2.0.11",
    "decord==0.6.0",
    # Official SAM3 still imports pkg_resources, removed in setuptools 81.
    "setuptools==80.10.2",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = {index = "pytorch-cu126"}
torchvision = {index = "pytorch-cu126"}

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["moonseg*"]

[tool.ruff]
line-length = 110
target-version = "py311"
