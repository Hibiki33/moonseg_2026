[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonseg"
version = "0.1.0"
description = "LuSNAR scene-held-out semantic segmentation with DINOv3 and Mask2Former"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "scipy>=1.12,<2",
    "PyYAML>=6,<7",
    "omegaconf>=2.3,<3",
    "safetensors>=0.5,<1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = {index = "pytorch-cu126"}
torchvision = {index = "pytorch-cu126"}

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["moonseg*"]

[tool.ruff]
line-length = 110
target-version = "py311"
