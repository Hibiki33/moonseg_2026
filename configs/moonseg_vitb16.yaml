# Development split: scene 5 is local validation; only official allowlist samples are admitted.
# The allowlist file must come from the organizers. Do not generate it by scanning public archives.
model:
  backbone: vitb16
  backbone_weights: ckpts/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  freeze_backbone: true
  num_classes: 5
  num_queries: 100
  hidden_dim: 256
  decoder_layers: 6
  encoder_layers: 6
loss:
  ce_weight: 2.0
  mask_weight: 5.0
  dice_weight: 5.0
  no_object_weight: 0.1
  num_points: 12544
data:
  root: data/LuSNAR
  train_manifest: data/manifests/train.json
  val_manifest: data/manifests/val.json
  official_allowlist: data/official/train_allowlist.json
  train_scenes: [1, 3, 6, 7, 8]
  val_scenes: [5]
  train_mode: full_image
  image_size: [1024, 1024]
  hflip_probability: 0.5
  photometric_probability: 0.5
  brightness_delta: 16
  contrast_range: [0.9, 1.1]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
train:
  output_dir: runs/moonseg_vitb16_1024
  seed: 42
  epochs: 80
  batch_size: 7
  accumulation_steps: 5
  # Strictly greater than 64: 7 x 2 GPUs x 5 accumulation = 70 images.
  min_effective_batch: 65
  num_workers: 4
  lr: 0.0001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.05
  # Roughly preserves the 6000-image warmup budget (86 x 70 = 6020).
  warmup_iters: 86
  warmup_ratio: 0.001
  poly_power: 0.9
  amp: bf16
  grad_clip: 0.1
  validate: true
  eval_every: 1
  save_every: 10
  log_every: 20
  resume: null
inference:
  sliding_window: false
  scales: [1.0]
  flip: false
