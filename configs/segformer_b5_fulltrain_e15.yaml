# Full official training membership, 15 epochs; final last only.
# Native B5 at 1024 squared: measured batch2 fits; batch4/8 OOM on 48GB.
# Microbatch2 x 2 GPUs x accumulation16 = effective batch64.
model:
  architecture: segformer_b5
  segformer_repo: third_party/segformer
  backbone: mit_b5
  backbone_weights: ckpts/segformer/mit_b5_imagenet.pth
  num_classes: 5
loss:
  type: semantic_cross_entropy
  loss_weight: 1.0
  ignore_index: 255
data:
  root: data/LuSNAR
  development_pool: true
  train_manifest: data/manifests/dev_final_train.json
  val_manifest: null
  label_stats: data/manifests/label_stats_dev_final_train.json
  train_scenes:
  - 1
  - 3
  - 5
  - 6
  - 7
  - 8
  val_scenes: []
  train_mode: random_resize_crop
  crop_size:
  - 1024
  - 1024
  resize_range:
  - 0.5
  - 2.0
  cat_max_ratio: 0.75
  crop_attempts: 10
  image_size:
  - 1024
  - 1024
  hflip_probability: 0.5
  brightness_probability: 0.5
  brightness_delta: 32
  contrast_probability: 0.5
  contrast_range:
  - 0.5
  - 1.5
  pixel_floor: 22
  gamma_probability: 0.0
  shadow_probability: 0.0
  scale_jitter_probability: 0.0
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
train:
  output_dir: runs/segformer_b5_fulltrain_e15
  seed: 42
  epochs: 15
  batch_size: 2
  accumulation_steps: 16
  min_effective_batch: 64
  num_workers: 4
  lr: 0.0006
  backbone_lr_multiplier: 0.1
  weight_decay: 0.01
  warmup_iters: 375
  warmup_ratio: 1.0e-06
  poly_power: 1.0
  amp: bf16
  tf32: true
  cudnn_benchmark: true
  grad_clip: 0.01
  sampling:
    mode: uniform
  validate: false
  eval_every: 1
  eval_stride: 2
  save_every: 0
  log_every: 10
  resume: null
inference:
  sliding_window: false
  scales:
  - 1.0
  flip: false
